run-name: test
name: test

on:
  push:
    branches:
      - develop

jobs:
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: yarn

  build:
    runs-on: ubuntu-latest

    needs: dependencies

    steps:
      - name: Build standalone
        run: yarn build

  linters:
    runs-on: ubuntu-latest

    needs: dependencies

    steps:
      - name: Code linting
        run: yarn linters
  
  deploy:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        run: yarn deploy

